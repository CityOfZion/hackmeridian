name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      connect_backend:
        description: 'Build an installable preview connected to the configured mainnet backend'
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm test
      - run: pnpm --dir backend test
      - name: Check Android JS bundle
        run: pnpm expo export --platform android --output-dir /tmp/vaultpass-js
        env:
          CI: '1'
          EXPO_PUBLIC_VAULTPASS_API_URL: https://ci.invalid

  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path contracts/p256-verifier/Cargo.toml
      - run: cargo test --locked --manifest-path contracts/freeze-policy/Cargo.toml

  android:
    name: Android installable CI build
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_PUBLIC_VAULTPASS_API_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.connect_backend && vars.VAULTPASS_API_URL || 'https://ci.invalid' }}
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Validate the connected preview endpoint
        if: github.event_name == 'workflow_dispatch' && inputs.connect_backend
        run: |
          node --input-type=module -e "import {releaseApiUrl} from './scripts/release-version.mjs'; const url=releaseApiUrl(process.env.EXPO_PUBLIC_VAULTPASS_API_URL); const response=await fetch(url+'/health'); const health=await response.json(); if(!response.ok || health.status!=='ok' || health.network!=='mainnet') throw new Error('Backend health check failed');"
      - name: Generate native Android project
        run: pnpm expo prebuild --platform android --no-install
      - name: Build standalone APK for CI (debug certificate)
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: android
      - name: Record the embedded backend and signing mode
        run: |
          node -e "require('fs').writeFileSync('android/app/build/outputs/apk/release/build-info.json',JSON.stringify({commit:process.env.GITHUB_SHA,apiUrl:process.env.EXPO_PUBLIC_VAULTPASS_API_URL,signing:'debug',mainnet:process.env.EXPO_PUBLIC_VAULTPASS_API_URL!=='https://ci.invalid'},null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: VaultPass-ci-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/build-info.json
          if-no-files-found: error
          retention-days: 14
