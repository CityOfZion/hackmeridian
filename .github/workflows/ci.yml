name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm test
      - run: pnpm --dir backend test
      - name: Check Android JS bundle
        run: pnpm expo export --platform android --output-dir /tmp/vaultpass-js
        env:
          CI: '1'
          EXPO_PUBLIC_VAULTPASS_API_URL: https://ci.invalid

  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path contracts/p256-verifier/Cargo.toml

  android:
    name: Android installable CI build
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_PUBLIC_VAULTPASS_API_URL: https://ci.invalid
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - name: Generate native Android project
        run: pnpm expo prebuild --platform android --no-install
      - name: Build standalone APK for CI (debug certificate; no production service)
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: VaultPass-ci-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
