[package]
name = "vaultpass-p256-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "=28.0.0", features = ["hazmat-crypto"] }
stellar-accounts = "=0.8.0"

[dev-dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils", "hazmat-crypto"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "arithmetic"] }

[profile.release]
overflow-checks = true
