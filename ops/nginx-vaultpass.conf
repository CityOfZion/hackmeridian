# Installed in /etc/nginx/sites-available/vaultpass after the certificate is issued.
limit_req_zone $binary_remote_addr zone=vaultpass_clients:10m rate=2r/s;

server {
    listen 80 default_server;
    server_name 100.62.97.60 ec2-100-62-97-60.compute-1.amazonaws.com;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 308 https://100.62.97.60$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 100.62.97.60;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/100.62.97.60/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/100.62.97.60/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VaultPassTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 4k;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location / {
        limit_req zone=vaultpass_clients burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
    }
}
